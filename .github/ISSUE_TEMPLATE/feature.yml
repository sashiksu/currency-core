name: Feature request
description: Propose a new capability or API for currency-core.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case first, then the proposed shape — this helps keep the discussion grounded in real needs.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve? Describe the real-world scenario where you need this capability.
      placeholder: I am building a checkout flow and need to format an amount with the correct minor-unit precision per currency...
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API shape
      description: Sketch the API you have in mind. TypeScript signatures are welcome.
      placeholder: |
        ```ts
        export function formatAmount(code: string, value: number): string;
        ```
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: change-type
    attributes:
      label: Is this additive or a breaking change?
      description: Help us scope the impact.
      options:
        - Additive (new export, no change to existing behavior)
        - Breaking change (modifies existing API surface or behavior)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why is this the best one?
    validations:
      required: false
