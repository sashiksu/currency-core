name: Weekly data regen

on:
  schedule:
    # Monday 06:00 UTC. Cheap-traffic window for SIX and CoinGecko.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data regen (auto-apply safe field updates)
        run: npm run regen:apply

      - name: Refresh codegen artifacts
        run: |
          npm run codegen
          npm run codegen:currencies

      - name: Refresh data-integrity snapshot if dataset changed
        run: npm test -- -u --silent
        # Snapshot is byte-stable when the dataset is unchanged, so this is a
        # no-op in weeks without drift. When data changes, the snapshot diff
        # becomes part of the PR for the reviewer to verify.

      - name: Open or update auto-PR if drift detected
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-regen/weekly
          base: main
          delete-branch: false
          title: "Weekly data regen — review upstream drift"
          commit-message: "Weekly data regen — auto-applied safe field updates and refreshed regen-report.md."
          body: |
            ## Weekly automated data regen

            Generated by `.github/workflows/data-regen.yml`. The `npm run regen:apply` step has already auto-applied safe field updates (decimals, numericCode) directly to `src/data/{fiat,historical}.ts`; everything else is in `regen-report.md` for manual curation.

            **Before merging:**
            - Inspect the diff under `src/data/` for the auto-applied updates.
            - Read `regen-report.md` and decide whether to add/move/remove records by hand on this branch.
            - Verify locally that `npm test`, `npm run typecheck`, `npm run codegen:check`, and `npm run codegen:currencies:check` all pass.

            Closes nothing automatically — close without merge if everything in the report is intentional / non-actionable for this cycle.
          add-paths: |
            src/data/
            src/codes.ts
            src/currencies/
            dts-bundle-generator.currencies.config.json
            regen-report.md
            src/__tests__/__snapshots__/
