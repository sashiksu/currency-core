name: CI

on:
  push:
    branches:
      - "release/**"
      - master
  pull_request:
    branches:
      - "release/**"
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test

      - name: Type tests
        run: npm run test:types

      - name: Verify file headers
        run: npm run verify:headers

      - name: Verify codegen is in sync
        run: npm run codegen:check

      - name: Verify per-currency entry codegen is in sync
        run: npm run codegen:currencies:check

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size
