    <title>currency-core · ISO 4217 + cryptocurrency data, one package</title>

    <script>
      // Pre-hydration theme: runs synchronously before first paint to avoid
      // a flash of the wrong color scheme on cold load.
      (function () {
        try {
          var stored = localStorage.getItem("ccc-theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          /* localStorage unavailable — keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
